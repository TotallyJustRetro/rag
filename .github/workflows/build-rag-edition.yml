name: RAG Edition Native Windows Build

on:
  workflow_dispatch:
    inputs:
      rom_path:
        description: Absolute path to your local USA Rev 0 ROM on the self-hosted Windows runner
        required: true
        default: 'C:/RAG-private/Mario & Luigi - Superstar Saga (USA).gba'
        type: string
      bios_path:
        description: Absolute path to your local retail GBA BIOS on the runner
        required: true
        default: 'C:/RAG-private/gba_bios.bin'
        type: string
      toolchain_root:
        description: MSYS2 MinGW-w64 root containing bin/g++.exe
        required: true
        default: 'C:/msys64/mingw64'
        type: string
      sdl_root:
        description: SDL2 MinGW SDK root containing include/SDL2/SDL.h and lib/libSDL2.dll.a
        required: true
        default: 'C:/msys64/mingw64'
        type: string
      jobs:
        description: Parallel build jobs
        required: true
        default: 4
        type: number
      output_dir:
        description: Local folder for the runnable RAG Edition package; keep it outside the Git checkout
        required: true
        default: 'C:/RAG-private/RAG-Edition'
        type: string

permissions:
  contents: read

# Deliberately manual-only. This uses local ROM/BIOS files on the runner and
# never uploads the game executable or ROM-derived generated source as an artifact.
jobs:
  build:
    name: Build RAG Edition on the owner's Windows machine
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 240
    steps:
      - name: Check out RAG and pinned submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify local build prerequisites and input files
        shell: pwsh
        env:
          RAG_ROM_PATH: ${{ inputs.rom_path }}
          RAG_BIOS_PATH: ${{ inputs.bios_path }}
          RAG_TOOLCHAIN_ROOT: ${{ inputs.toolchain_root }}
          RAG_SDL_ROOT: ${{ inputs.sdl_root }}
          RAG_OUTPUT_DIR: ${{ inputs.output_dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\tools\check-rag-build.ps1' -Rom $env:RAG_ROM_PATH -Bios $env:RAG_BIOS_PATH -Toolchain $env:RAG_TOOLCHAIN_ROOT -SdlRoot $env:RAG_SDL_ROOT -OutputDir $env:RAG_OUTPUT_DIR
          # build-host.ps1 invokes cmake and Ninja by name; make the selected
          # toolchain explicit for every step in this runner job.
          (Join-Path $env:RAG_TOOLCHAIN_ROOT 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host 'Preflight passed. ROM and BIOS remain local runner inputs; neither is uploaded to GitHub.'

      - name: Generate and compile the RAG Edition executable
        shell: pwsh
        env:
          RAG_ROM_PATH: ${{ inputs.rom_path }}
          RAG_BIOS_PATH: ${{ inputs.bios_path }}
          RAG_TOOLCHAIN_ROOT: ${{ inputs.toolchain_root }}
          RAG_SDL_ROOT: ${{ inputs.sdl_root }}
          RAG_JOBS: ${{ inputs.jobs }}
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\\tools\\build-mlss.ps1' -Rom $env:RAG_ROM_PATH -Bios $env:RAG_BIOS_PATH -Toolchain $env:RAG_TOOLCHAIN_ROOT -SdlRoot $env:RAG_SDL_ROOT -Jobs ([int]$env:RAG_JOBS)
          if ($LASTEXITCODE -ne 0) { throw "RAG Edition build wrapper failed with exit code $LASTEXITCODE." }

      - name: Stage a portable local RAG Edition folder
        shell: pwsh
        env:
          RAG_OUTPUT_DIR: ${{ inputs.output_dir }}
          RAG_ROM_PATH: ${{ inputs.rom_path }}
          RAG_BIOS_PATH: ${{ inputs.bios_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $integration = Join-Path $PWD 'reference/mlss'
          $buildDir = Join-Path $integration 'build/host'
          $output = [System.IO.Path]::GetFullPath($env:RAG_OUTPUT_DIR)
          $workspace = [System.IO.Path]::GetFullPath($PWD.Path)
          $separator = [string][System.IO.Path]::DirectorySeparatorChar
          $trimChars = [char[]]@([char]92, [char]47)
          if ($output.Equals([System.IO.Path]::GetPathRoot($output), [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'A drive root cannot be used as the package output directory.'
          }
          $outputPrefix = $output.TrimEnd($trimChars) + $separator
          $workspacePrefix = $workspace.TrimEnd($trimChars) + $separator
          if ($output.Equals($workspace, [System.StringComparison]::OrdinalIgnoreCase) -or
              $output.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase) -or
              $workspace.StartsWith($outputPrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'Choose an output folder outside the Git checkout and not one of its parent folders.'
          }
          foreach ($inputFile in @($env:RAG_ROM_PATH, $env:RAG_BIOS_PATH)) {
            $inputFull = [System.IO.Path]::GetFullPath($inputFile)
            if ($inputFull.StartsWith($outputPrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "The package output directory would contain a ROM/BIOS input: $inputFull"
            }
          }
          $exe = Join-Path $buildDir 'RAGSuperstarSaga.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Expected RAG executable was not produced: $exe"
          }
          $marker = Join-Path $output '.rag-package-managed'
          if (Test-Path -LiteralPath $output) {
            if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) {
              throw "Refusing to delete an existing unmarked folder. Choose a new output directory or add the RAG marker only to a directory you dedicate to this build: $output"
            }
            Remove-Item -LiteralPath $output -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Set-Content -LiteralPath (Join-Path $output '.rag-package-managed') -Value 'Managed by the RAG Edition build workflow.' -Encoding utf8
          Copy-Item -LiteralPath $exe -Destination $output
          foreach ($binary in @('SDL2.dll','libgcc_s_seh-1.dll','libstdc++-6.dll','libwinpthread-1.dll')) {
            $source = Join-Path $buildDir $binary
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Required runtime dependency was not staged: $source"
            }
            Copy-Item -LiteralPath $source -Destination $output
          }
          $assets = Join-Path $buildDir 'assets'
          if (Test-Path -LiteralPath $assets -PathType Container) {
            $destAssets = Join-Path $output 'assets'
            New-Item -ItemType Directory -Force -Path $destAssets | Out-Null
            Get-ChildItem -LiteralPath $assets -Force | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination $destAssets -Recurse -Force
            }
          } else {
            throw "Launcher assets are missing from the build output: $assets"
          }
          $gameConfigPath = Join-Path $integration 'game.toml'
          $gameConfig = [System.IO.File]::ReadAllText($gameConfigPath)
          $romPathRegex = [regex]::new('(?m)(^\[rom\]\r?\n)path\s*=\s*"[^"]*"')
          if (-not $romPathRegex.IsMatch($gameConfig)) {
            throw 'Could not locate the [rom].path field to prepare a portable first-run config.'
          }
          $gameConfig = $romPathRegex.Replace($gameConfig, '$1path = ""', 1)
          [System.IO.File]::WriteAllText(
            (Join-Path $output 'game.toml'),
            $gameConfig,
            [System.Text.UTF8Encoding]::new($false)
          )
          foreach ($notice in @('LICENSE','THIRD_PARTY_NOTICES.md')) {
            $source = Join-Path $integration $notice
            if (Test-Path -LiteralPath $source -PathType Leaf) {
              Copy-Item -LiteralPath $source -Destination $output
            }
          }
          Copy-Item -LiteralPath (Join-Path $PWD 'README.md') -Destination (Join-Path $output 'README.md')
          Copy-Item -LiteralPath (Join-Path $integration 'README.md') -Destination (Join-Path $output 'UPSTREAM-README.md')
          New-Item -ItemType Directory -Force -Path (Join-Path $output 'saves') | Out-Null
          @(
            'RAG Edition — Mario & Luigi: Superstar Saga (USA A88E Rev 0)',
            '',
            'This is a local, portable build. It does not include a game ROM or GBA BIOS.',
            'Start RAGSuperstarSaga.exe and select your own ROM and retail BIOS in the launcher.',
            'Aspect-correct resizeable window, optional sharp/affine display filters, FPS readout, rewind, fast-forward, and save-state tools are enabled.',
            'Progress saves are stored in the saves folder. Before interactive sessions, RAG rotates saves/rag_mlss_usa.sav.bak and .bak.1.',
            'Settings/keybindings/cache paths are isolated as rag-config.ini, rag-keybinds.ini, rag-rom.cfg, and rag-bios.cfg.',
            'The executable and generated source are not uploaded by the workflow.'
          ) | Set-Content -LiteralPath (Join-Path $output 'RAG-README.txt') -Encoding utf8
          Write-Host "Portable local build staged at: $output"

      - name: Smoke-test the staged executable
        shell: pwsh
        env:
          RAG_ROM_PATH: ${{ inputs.rom_path }}
          RAG_BIOS_PATH: ${{ inputs.bios_path }}
          RAG_OUTPUT_DIR: ${{ inputs.output_dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $integration = Join-Path $PWD 'reference/mlss'
          $localRom = Join-Path $integration 'Mario Luigi - Superstar Saga (USA).gba'
          $exe = Join-Path $env:RAG_OUTPUT_DIR 'RAGSuperstarSaga.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Expected staged RAG executable was not produced: $exe"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $env:RAG_OUTPUT_DIR 'assets') -PathType Container)) {
            throw 'Staged launcher assets are missing.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $env:RAG_OUTPUT_DIR 'game.toml') -PathType Leaf)) {
            throw 'Staged game.toml is missing.'
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $env:RAG_OUTPUT_DIR 'saves') | Out-Null
          Push-Location $env:RAG_OUTPUT_DIR
          try {
            & $exe --rom $localRom --bios $env:RAG_BIOS_PATH --save 'saves/rag_mlss_usa.sav' --frames 600 --no-window
            if ($LASTEXITCODE -ne 0) { throw "Headless smoke test failed with exit code $LASTEXITCODE." }
          } finally {
            Pop-Location
          }
          Write-Host 'PASS: staged native executable completed the 600-frame headless smoke test.'
          Write-Host "Portable local folder: $env:RAG_OUTPUT_DIR"
