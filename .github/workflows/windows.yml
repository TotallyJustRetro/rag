name: Windows x64 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Validate PowerShell build script syntax
        shell: pwsh
        run: |
          foreach ($scriptPath in @('tools/build-mlss.ps1', 'tools/apply-rag-variant.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $scriptPath),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$scriptPath : $($_.Message)" }
              exit 1
            }
            Write-Host "PASS PowerShell syntax: $scriptPath"
          }
      - name: Configure x64 build
        run: cmake -S . -B build -A x64
      - name: Compile Release
        run: cmake --build build --config Release --parallel
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload initial Windows tools
        uses: actions/upload-artifact@v4
        with:
          name: rag-diagnostics-windows-x64
          path: |
            build/Release/rag.exe
            build/Release/rag_tests.exe
          if-no-files-found: error
          retention-days: 14

  integration-contract:
    runs-on: windows-latest
    steps:
      - name: Check out repository and pinned submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Verify the pinned Superstar Saga integration
        shell: pwsh
        run: |
          $integration = Join-Path $PWD 'reference/mlss'
          if (-not (Test-Path (Join-Path $integration 'game.toml'))) {
            throw 'Pinned integration game.toml is missing.'
          }
          if (-not (Test-Path (Join-Path $integration 'LICENSE'))) {
            throw 'Pinned integration license is missing.'
          }
          $head = (git -C $integration rev-parse HEAD).Trim()
          if ($head -ne '5c742186b131b88e48a4ba9b033ce0a480f23ccd') {
            throw "Unexpected integration revision: $head"
          }
          $config = Get-Content (Join-Path $integration 'game.toml') -Raw
          foreach ($required in @('Mario & Luigi: Superstar Saga', 'id = "A88E"', 'size = 0x01000000', '7c303cdde5061ee329296948060b875cb50ba410', 'type = "eeprom"', 'size = 8192')) {
            if (-not $config.Contains($required)) {
              throw "Integration configuration is missing expected marker: $required"
            }
          }
          foreach ($requiredPath in @('gbarecomp/CMakeLists.txt', 'recomp-ui/recomp_ui.cmake', 'tools/regen.ps1', 'tools/build-host.ps1')) {
            if (-not (Test-Path (Join-Path $integration $requiredPath))) {
              throw "Missing integration/dependency file: $requiredPath"
            }
          }
          Write-Host 'PASS: pinned integration, engine, launcher, ROM identity and save config.'

      - name: Apply and validate RAG Edition overlays
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $integration = Join-Path $PWD 'reference/mlss'
          & '.\tools\apply-rag-variant.ps1' -IntegrationPath $integration
          # The overlay is expected to be safe to re-apply when a local build is resumed.
          & '.\tools\apply-rag-variant.ps1' -IntegrationPath $integration

          $main = Get-Content (Join-Path $integration 'src/main.cpp') -Raw
          $config = Get-Content (Join-Path $integration 'game.toml') -Raw
          $cmake = Get-Content (Join-Path $integration 'CMakeLists.txt') -Raw
          $buildScript = Get-Content (Join-Path $integration 'tools/build-host.ps1') -Raw
          $launcherBoot = Get-Content (Join-Path $integration 'src/game_launcher_boot.cpp') -Raw
          $runtimeHeader = Get-Content (Join-Path $integration 'gbarecomp/src/runtime/host_window.h') -Raw
          $runtimeWindow = Get-Content (Join-Path $integration 'gbarecomp/src/runtime/host_window.cpp') -Raw
          $runtimeCore = Get-Content (Join-Path $integration 'gbarecomp/src/runtime/runtime.cpp') -Raw

          foreach ($marker in @(
            'RAG Edition: Superstar Saga',
            'rag-config.ini',
            'rag-keybinds.ini',
            'saves/rag_mlss_usa.sav',
            'show_fps_by_default = true',
            'freely_resizable_window = true',
            'launcher_expose_sharp_filter = true',
            'launcher_default_sharp_filter = false',
            'launcher_expose_affine_filter = true',
            'launcher_default_affine_filter = false',
            'expose_assist_tools = true',
            'rewind_history_seconds = 5'
          )) {
            if (-not $main.Contains($marker)) { throw "RAG source overlay missing marker: $marker" }
          }
          if (-not $config.Contains('window_title = "RAG Edition: Superstar Saga"')) { throw 'RAG window title not applied.' }
          if (-not $config.Contains('path = "saves/rag_mlss_usa.sav"')) { throw 'RAG save path not isolated.' }
          if (-not $cmake.Contains('OUTPUT_NAME "RAGSuperstarSaga"')) { throw 'RAG executable output name not applied.' }
          if (-not $buildScript.Contains('RAGSuperstarSaga.exe')) { throw 'Build script does not check the RAG executable name.' }
          foreach ($marker in @(
            @{ Source = $launcherBoot; Text = '"rag-rom.cfg"'; Label = 'RAG ROM cache filename' },
            @{ Source = $launcherBoot; Text = '"rag-bios.cfg"'; Label = 'RAG BIOS cache filename' },
            @{ Source = $runtimeHeader; Text = 'const char* keybinds_filename = nullptr'; Label = 'runtime filename API' },
            @{ Source = $runtimeCore; Text = 'opts.launcher_config_filename'; Label = 'runtime config wiring' },
            @{ Source = $runtimeCore; Text = 'opts.launcher_keybinds_filename'; Label = 'runtime keybind wiring' },
            @{ Source = $runtimeWindow; Text = 'b->input_config_filename'; Label = 'variant runtime config use' },
            @{ Source = $runtimeWindow; Text = 'keybinds_name'; Label = 'variant keybinding use' }
          )) {
            if (-not $marker.Source.Contains($marker.Text)) { throw "RAG runtime isolation missing: $($marker.Label)" }
          }
          $uniqueMarkers = @(
            @{ Source = $main; Text = 'options.builtin_game_name = "RAG Edition: Superstar Saga";'; Label = 'launcher identity' },
            @{ Source = $main; Text = 'options.launcher_save_path = "saves/rag_mlss_usa.sav";'; Label = 'launcher save path' },
            @{ Source = $cmake; Text = 'set_target_properties(MarioLuigiSuperstarSagaRecomp PROPERTIES OUTPUT_NAME "RAGSuperstarSaga")'; Label = 'executable output name' },
            @{ Source = $config; Text = 'path = "saves/rag_mlss_usa.sav"'; Label = 'TOML save path' }
          )
          foreach ($marker in $uniqueMarkers) {
            $count = [regex]::Matches($marker.Source, [regex]::Escape($marker.Text)).Count
            if ($count -ne 1) { throw "Overlay idempotency failed for $($marker.Label) (expected one marker, found $count)." }
          }
          Write-Host 'PASS: RAG Edition source overlay, isolated save, target name, and re-application contract.'

  runtime-overlay-compile:
    name: Compile RAG's patched runtime
    runs-on: windows-latest
    needs: integration-contract
    timeout-minutes: 60
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up the pinned toolchain family and SDL2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          suppress-deprecation-warnings: msystem-mingw64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2

      - name: Set dynamic MSYS2 toolchain paths
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = Join-Path $env:MSYS2_LOCATION 'mingw64'
          foreach ($required in @('bin/gcc.exe','bin/g++.exe','bin/cmake.exe','bin/ninja.exe','include/SDL2/SDL.h','lib/libSDL2.dll.a')) {
            if (-not (Test-Path -LiteralPath (Join-Path $toolchain $required))) {
              throw "MSYS2 toolchain file missing: $(Join-Path $toolchain $required)"
            }
          }
          "RAG_TOOLCHAIN_ROOT=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RAG_SDL_ROOT=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Validated MinGW/SDL2 under $toolchain"

      - name: Initialize the upstream's pinned build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\\reference\\mlss\\tools\\setup-deps.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Dependency setup failed with exit code $LASTEXITCODE." }

      - name: Apply the RAG Edition overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\\tools\\apply-rag-variant.ps1' -IntegrationPath (Join-Path $PWD 'reference/mlss')

      - name: Configure and build the recompiler generator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\\reference\\mlss\\tools\\build-host.ps1' -Jobs 4 -Toolchain $env:RAG_TOOLCHAIN_ROOT -SdlRoot $env:RAG_SDL_ROOT -GeneratorOnly
          if ($LASTEXITCODE -ne 0) { throw "Generator build failed with exit code $LASTEXITCODE." }

      - name: Compile the patched runtime library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:RAG_TOOLCHAIN_ROOT 'bin/cmake.exe') --build 'reference/mlss/build/host' --target gbarecomp_runtime --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Patched runtime compilation failed with exit code $LASTEXITCODE." }
          Write-Host 'PASS: patched host_window and runtime sources compile with MinGW/SDL2.'

      - name: Compile modified game entry and launcher seam
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gxx = Join-Path $env:RAG_TOOLCHAIN_ROOT 'bin/g++.exe'
          $includeArgs = @(
            '-std=c++20',
            '-DRECOMP_LAUNCHER',
            '-fsyntax-only',
            '-Ireference/mlss/gbarecomp/src/runtime',
            '-Ireference/mlss/gbarecomp/src/gba',
            '-Ireference/mlss/gbarecomp/src/armv4t',
            '-Ireference/mlss/recomp-ui/src',
            '-Ireference/mlss/recomp-ui/src/common',
            '-Ireference/mlss/recomp-ui/src/third_party/imgui'
          )
          & $gxx @includeArgs 'reference/mlss/src/main.cpp'
          if ($LASTEXITCODE -ne 0) { throw "Patched main.cpp syntax check failed with exit code $LASTEXITCODE." }
          & $gxx @includeArgs 'reference/mlss/src/game_launcher_boot.cpp'
          if ($LASTEXITCODE -ne 0) { throw "Patched game_launcher_boot.cpp syntax check failed with exit code $LASTEXITCODE." }
          Write-Host 'PASS: RAG main.cpp and game launcher/ROM-BIOS validation compile independently of ROM-generated shards.'
