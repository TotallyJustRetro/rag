name: RAG Edition Private Windows Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: RAG source branch, tag, or commit to build
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: rag-private-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build on a GitHub-hosted Windows runner
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Refuse to run unless this repository is private
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if (-not [bool]$event.repository.private) {
            throw 'This workflow must live in a PRIVATE companion repository. Do not store ROM/BIOS files or upload the game package from the public RAG repository.'
          }
          Write-Host 'PASS: workflow is running in a private repository.'

      - name: Check out private input storage
        uses: actions/checkout@v5
        with:
          path: private-inputs
          persist-credentials: false

      - name: Check out public RAG source and pinned submodules
        uses: actions/checkout@v5
        with:
          repository: TotallyJustRetro/rag
          ref: ${{ inputs.source_ref }}
          submodules: recursive
          path: rag
          persist-credentials: false

      - name: Set up MinGW-w64 and SDL2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2

      - name: Set build toolchain paths
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = Join-Path $env:MSYS2_LOCATION 'mingw64'
          foreach ($relative in @('bin/gcc.exe','bin/g++.exe','bin/cmake.exe','bin/ninja.exe','include/SDL2/SDL.h','lib/libSDL2.dll.a','bin/SDL2.dll')) {
            $path = Join-Path $toolchain $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required build file missing: $path"
            }
          }
          "RAG_TOOLCHAIN_ROOT=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RAG_SDL_ROOT=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'PASS: MinGW-w64 and SDL2 paths validated.'

      - name: Validate private inputs and build paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rom = Join-Path $env:GITHUB_WORKSPACE 'private-inputs/assets/Mario & Luigi - Superstar Saga (USA).gba'
          $bios = Join-Path $env:GITHUB_WORKSPACE 'private-inputs/assets/gba_bios.bin'
          $output = Join-Path $env:GITHUB_WORKSPACE 'private-inputs/build-output/RAG-Edition'
          & (Join-Path $env:GITHUB_WORKSPACE 'rag/tools/check-rag-build.ps1') -Rom $rom -Bios $bios -Toolchain $env:RAG_TOOLCHAIN_ROOT -SdlRoot $env:RAG_SDL_ROOT -OutputDir $output

      - name: Generate native game code and compile RAGSuperstarSaga.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rom = Join-Path $env:GITHUB_WORKSPACE 'private-inputs/assets/Mario & Luigi - Superstar Saga (USA).gba'
          $bios = Join-Path $env:GITHUB_WORKSPACE 'private-inputs/assets/gba_bios.bin'
          & (Join-Path $env:GITHUB_WORKSPACE 'rag/tools/build-mlss.ps1') -Rom $rom -Bios $bios -Toolchain $env:RAG_TOOLCHAIN_ROOT -SdlRoot $env:RAG_SDL_ROOT -Jobs 4
          if ($LASTEXITCODE -ne 0) { throw "Native RAG build failed with exit code $LASTEXITCODE." }

      - name: Stage portable package without ROM or BIOS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $integration = Join-Path $env:GITHUB_WORKSPACE 'rag/reference/mlss'
          $buildDir = Join-Path $integration 'build/host'
          $output = Join-Path $env:GITHUB_WORKSPACE 'private-inputs/build-output/RAG-Edition'
          $rom = Join-Path $env:GITHUB_WORKSPACE 'private-inputs/assets/Mario & Luigi - Superstar Saga (USA).gba'
          $bios = Join-Path $env:GITHUB_WORKSPACE 'private-inputs/assets/gba_bios.bin'
          $marker = Join-Path $output '.rag-package-managed'
          if (Test-Path -LiteralPath $output) {
            if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) {
              throw "Refusing to remove an existing unmarked output directory: $output"
            }
            Remove-Item -LiteralPath $output -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Set-Content -LiteralPath (Join-Path $output '.rag-package-managed') -Value 'Managed by the private RAG build workflow.' -Encoding utf8

          $exe = Join-Path $buildDir 'RAGSuperstarSaga.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Native executable not found: $exe"
          }
          Copy-Item -LiteralPath $exe -Destination $output
          foreach ($binary in @('SDL2.dll','libgcc_s_seh-1.dll','libstdc++-6.dll','libwinpthread-1.dll')) {
            $source = Join-Path $buildDir $binary
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Required runtime dependency missing: $source"
            }
            Copy-Item -LiteralPath $source -Destination $output
          }

          $assets = Join-Path $buildDir 'assets'
          if (-not (Test-Path -LiteralPath $assets -PathType Container)) {
            throw "Launcher assets missing: $assets"
          }
          Copy-Item -LiteralPath $assets -Destination (Join-Path $output 'assets') -Recurse -Force

          $gameConfigPath = Join-Path $integration 'game.toml'
          $gameConfig = [System.IO.File]::ReadAllText($gameConfigPath)
          $romPathRegex = [regex]::new('(?m)(^\[rom\]\r?\n)path\s*=\s*"[^"]*"')
          if (-not $romPathRegex.IsMatch($gameConfig)) {
            throw 'Could not find [rom].path in game.toml.'
          }
          $gameConfig = $romPathRegex.Replace($gameConfig, '$1path = ""', 1)
          [System.IO.File]::WriteAllText((Join-Path $output 'game.toml'), $gameConfig, [System.Text.UTF8Encoding]::new($false))

          foreach ($notice in @('LICENSE','THIRD_PARTY_NOTICES.md')) {
            $source = Join-Path $integration $notice
            if (Test-Path -LiteralPath $source -PathType Leaf) {
              Copy-Item -LiteralPath $source -Destination $output
            }
          }
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'rag/README.md') -Destination (Join-Path $output 'README.md')
          Copy-Item -LiteralPath (Join-Path $integration 'README.md') -Destination (Join-Path $output 'UPSTREAM-README.md')
          New-Item -ItemType Directory -Force -Path (Join-Path $output 'saves') | Out-Null
          @(
            'RAG Edition — Mario & Luigi: Superstar Saga (USA A88E Rev 0)',
            '',
            'Private CI build package. The game ROM and GBA BIOS are intentionally not included.',
            'Launch RAGSuperstarSaga.exe and select your own supported ROM and retail BIOS in the launcher.',
            'Keep the EXE, DLLs, assets folder, and game.toml together.',
            'This is an experimental build; full-campaign compatibility is not guaranteed.'
          ) | Set-Content -LiteralPath (Join-Path $output 'RAG-README.txt') -Encoding utf8

          # A short headless smoke test uses private inputs, but does not copy them into the package.
          Push-Location $output
          try {
            & (Join-Path $output 'RAGSuperstarSaga.exe') --rom $rom --bios $bios --save 'saves/rag_mlss_usa.sav' --frames 600 --no-window
            if ($LASTEXITCODE -ne 0) { throw "600-frame smoke test failed with exit code $LASTEXITCODE." }
          } finally {
            Pop-Location
          }

          Write-Host 'PASS: package staged and 600-frame smoke test succeeded. ROM/BIOS are not inside the package.'

      - name: Upload build package to this private repository only
        uses: actions/upload-artifact@v4
        with:
          name: RAG-Edition-Windows-x64
          path: private-inputs/build-output/RAG-Edition/
          if-no-files-found: error
          retention-days: 7
